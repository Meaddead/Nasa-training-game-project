<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol Keepers</title>
<style>
:root{--bg:#0b0e1c;--card:#151a30;--card2:#1e2440;--line:#2c3359;--txt:#f1f3ff;--dim:#9aa1c9;--mars:#e2703a;--pow:#ffd23f;--o2:#58c7f3;--food:#6fd872;--rad:#c77dff;--bad:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:10px}
a{color:#8fd3ff}
#app{max-width:1500px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:22px;line-height:1;margin:0;letter-spacing:.3px;white-space:nowrap}
h1 span{color:var(--mars)}
.badge{font-size:12px;line-height:1;background:var(--card2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;color:var(--dim);white-space:nowrap}
.badge.live{color:#9dffb0;border-color:#3f8f55}
#dateline{font-size:12px;color:var(--dim)}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#clock{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 14px;display:flex;align-items:center;white-space:nowrap}
.top button{background:var(--card2);height:40px;min-width:44px;padding:0 12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;line-height:1}
.top button:hover{border-color:#4a5388}
.top button.sel{border-color:var(--mars);background:#3a2620}
.seg{display:flex;gap:0}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button.sel{position:relative;z-index:1}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
#swipe{display:none}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.mapcard{overflow:hidden}
canvas#cv{width:100%;display:block;touch-action:manipulation;cursor:pointer;background:#7a3b22}
@media(max-width:900px){#scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}canvas#cv{width:820px;max-width:none}#swipe{display:block;font-size:12px;color:var(--dim);text-align:center;padding:6px 10px 0}}
#hint{font-size:13px;color:var(--dim);padding:10px 14px;border-top:1px solid var(--line);min-height:40px}
#hint b{color:var(--txt)}
#log{font-size:13px;max-height:118px;overflow:auto;border-top:1px solid var(--line);padding:4px 14px 8px}
#log div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:4px 0;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.04)}
#log div:first-child{color:var(--txt)}
#log .t{font-weight:800;font-variant-numeric:tabular-nums;color:var(--mars)}
.side{padding:12px;display:flex;flex-direction:column;gap:12px}
.sect{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);margin:0 0 -4px 2px}
#meters{display:flex;flex-direction:column;gap:8px}
.meter{background:var(--card2);border-radius:12px;padding:9px 12px}
.meter .l{display:flex;align-items:baseline;justify-content:space-between;gap:8px;white-space:nowrap}
.meter .nm{font-weight:800;font-size:14px}
.meter .val{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.meter .val small{font-weight:600;color:var(--dim);font-size:12px}
.bar{height:8px;background:#0a0c18;border-radius:99px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .25s}
.meter .note{font-size:12px;color:var(--dim);line-height:1.2}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{background:var(--card2);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.chip .k{font-size:12px;color:var(--dim)}
.chip .v{font-weight:800;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.chip .v small{font-size:12px;font-weight:600;color:var(--dim)}
#palette{display:flex;flex-direction:column;gap:6px}
#palette button{background:var(--card2);padding:6px 10px 6px 6px;text-align:left;border:1.5px solid transparent;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;width:100%}
#palette button:hover{border-color:#4a5388}
#palette button.sel{border-color:var(--mars);background:#3a2620}
#palette button.poor{opacity:.5}
#palette .ic{width:46px;height:43px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(226,112,58,.16);border-radius:9px}
#palette canvas.ic{display:block}
#palette b{display:block;font-size:14px;line-height:1.2}
#palette small{display:block;font-size:12px;color:var(--dim);line-height:1.25;margin-top:1px}
#palette .cost{font-weight:800;font-size:13px;white-space:nowrap;background:#0f1326;border-radius:99px;padding:4px 9px;font-variant-numeric:tabular-nums}
#ov{position:fixed;inset:0;background:rgba(5,6,16,.8);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
#ov.show{display:flex}
#box{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--mars);border-radius:18px;max-width:540px;width:100%;max-height:92vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#box .big{font-size:42px;line-height:1;text-align:center;margin-bottom:8px}
#box h2{margin:0 0 10px;font-size:21px;line-height:1.2;text-align:center}
#box p{margin:9px 0}
#box .src{font-size:12px;color:var(--dim);background:var(--card2);border-radius:10px;padding:8px 10px}
#box .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#box .btns button{flex:1 1 200px;background:var(--mars);color:#fff;font-weight:800;padding:12px 14px;min-height:48px;line-height:1.25;text-align:center}
#box .btns button.alt{background:var(--card2);border:1px solid var(--line)}
#box table{border-collapse:collapse;width:100%;font-size:13px}
#box td,#box th{border-bottom:1px solid var(--line);padding:6px 6px 6px 0;text-align:left;vertical-align:top}
#box td:last-child{padding-right:0}
#box h3{font-size:12px;letter-spacing:.9px;text-transform:uppercase;margin:16px 0 4px;color:var(--mars)}
.foot{font-size:12px;color:var(--dim);text-align:center;margin-top:10px}
.foot button{background:none;color:#8fd3ff;text-decoration:underline;padding:4px}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <div class="row"><h1>🪐 <span>Sol</span> Keepers</h1><span class="badge" id="badge">NASA data</span></div>
    <div id="dateline"></div>
  </div>
  <div class="top">
    <span id="clock">Sol 1</span>
    <div class="seg">
      <button id="sp0" aria-label="Pause" title="Pause">⏸</button>
      <button id="sp1" aria-label="Play" title="Play">▶</button>
      <button id="sp3" aria-label="Fast" title="Fast">▶▶</button>
    </div>
    <button id="bdata">📚 NASA data</button>
  </div>
</header>
<main>
  <div class="card mapcard">
    <div id="scroll"><canvas id="cv" width="1200" height="790"></canvas></div>
    <div id="swipe">↔ Swipe the map sideways to see all of it</div>
    <div id="hint"></div>
    <div id="log"></div>
  </div>
  <div class="card side">
    <div class="sect">Base status</div>
    <div id="meters"></div>
    <div class="chips">
      <div class="chip"><span class="k">🔬 Science</span><span class="v" id="sci">0</span></div>
      <div class="chip"><span class="k">🔩 Parts</span><span class="v" id="parts">0</span></div>
    </div>
    <div class="sect">Build</div>
    <div id="palette"></div>
  </div>
</main>
<div class="foot">Solar storm data: NASA DONKI. Not an official NASA product. <button id="bdata2">See every data source</button></div>
</div>
<div id="ov"><div id="box"></div></div>

<script id="core">
/* ---------- Simulation core (no DOM) ---------- */
const Core=(()=>{
const W=14,H=10,SOLS=30,DOSE_LIMIT=40,BG_DOSE=0.67; // 0.67 mSv per day: Curiosity RAD surface measurement
const STORM_DOSE={1:2,2:4,3:8}, STORM_HOURS=8;
const B={
  panel:{name:'Solar Panel',icon:'▦',cost:2,use:0,txt:'+8 power each daylight hour. Sleeps at night.'},
  battery:{name:'Battery',icon:'🔋',cost:2,use:0,txt:'Stores 40 more power for the night.'},
  o2:{name:'Oxygen Maker',icon:'💨',cost:3,use:2,txt:'Uses 2 power → makes 2 oxygen an hour.'},
  green:{name:'Greenhouse',icon:'🌱',cost:3,use:3,txt:'Uses 3 power → grows food and a little oxygen.'},
  shelter:{name:'Storm Shelter',icon:'🛡️',cost:4,use:8,txt:'Starts switched off. Uses 8 power when on. Blocks storm radiation, but no science while inside.'},
  lab:{name:'Science Lab',icon:'🔬',cost:4,use:4,txt:'Uses 4 power → 1 science point an hour.'},
  dish:{name:'Comms Dish',icon:'📡',cost:3,use:1,txt:'Uses 1 power. Hears storm warnings from Earth early.'}
};
const ORDER=['o2','shelter','green','dish','lab'];
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const T=(sol,hour)=>(sol-1)*24+hour;

/* Archived real events, May 2024. Sol N of the mission uses the space weather of May N, 2024.
   Storm level is a game rule: how many DONKI instrument detections were logged that day (1-2 → level 1, 3-4 → 2, 5+ → 3). */
function archiveEvents(){
  const d=n=>'May '+n+', 2024';
  return {mode:'archive',label:'Archived NASA data · May 2024',start:'2024-05-01',
   storms:[
    {sol:9,hour:13,level:1,date:d(9),id:'2024-05-09T13:59:00-SEP-001',n:2},
    {sol:10,hour:12,level:2,date:d(10),id:'2024-05-10T12:59:00-SEP-001',n:4},
    {sol:11,hour:2,level:1,date:d(11),id:'2024-05-11T02:10:00-SEP-001',n:2},
    {sol:13,hour:12,level:3,date:d(13),id:'2024-05-13T12:44:00-SEP-001',n:6},
    {sol:20,hour:10,level:3,date:d(20),id:null,mars:true}
   ],
   blackouts:[{sol:14,hour:16,dur:6,date:d(14),id:'2024-05-14T16:46:00-FLR-001',cls:'X8.7'}]};
}
/* Build events from live DONKI responses (SEP and FLR arrays). startDate = Date of sol 1 (UTC). */
function eventsFromDonki(sep,flr,startDate){
  const day=iso=>Math.floor((Date.parse(iso)-startDate.getTime())/864e5)+1;
  const fmt=iso=>new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
  const by={};
  (sep||[]).forEach(e=>{const s=day(e.eventTime);if(!(s>=1&&s<=SOLS))return;
    (by[s]=by[s]||{sol:s,hour:new Date(e.eventTime).getUTCHours(),date:fmt(e.eventTime),id:e.sepID,n:0}).n++;});
  const storms=Object.values(by).map(x=>({...x,level:x.n>=5?3:x.n>=3?2:1}));
  const blackouts=(flr||[]).filter(f=>/^X/.test(f.classType||'')).map(f=>({sol:day(f.beginTime),hour:new Date(f.beginTime).getUTCHours(),dur:6,date:fmt(f.beginTime),id:f.flrID,cls:f.classType}))
    .filter(b=>b.sol>=1&&b.sol<=SOLS).slice(0,4);
  const end=new Date(startDate.getTime()+29*864e5);
  return {mode:'live',label:'Live NASA data · '+fmt(startDate.toISOString())+' to '+fmt(end.toISOString()),start:startDate.toISOString().slice(0,10),storms,blackouts};
}
function newGame(seed,ev){
  const r=rng(seed);
  const s={seed,ev,sol:1,hour:6,parts:8,income:2,power:30,o2:150,food:60,dose:0,science:0,grid:new Array(W*H).fill(null),tex:[],
    up:{robot:false,wipers:false},over:null,gen:0,used:0,starved:false,sheltered:false,flags:{},stats:{stormDose:0,blocked:0,opps:0}};
  for(let i=0;i<W*H;i++)s.tex.push(r());
  const mid=Math.floor(H/2)*W+Math.floor(W/2); s.grid[mid]={type:'hab'}; s.grid[mid+2*W+3]={type:'lander'}; s.grid[mid+1]={type:'panel',on:true}; s.grid[mid-1]={type:'battery',on:true};
  let rocks=0;while(rocks<16){const i=Math.floor(r()*W*H),dc=Math.abs(i%W-mid%W),dr=Math.abs(Math.floor(i/W)-Math.floor(mid/W));if(!s.grid[i]&&!(dc<=2&&dr<=1)){s.grid[i]={type:rocks<12?'rock':'crater'};rocks++;}}
  s.storms=ev.storms.map(x=>({...x,t:T(x.sol,x.hour),dur:STORM_HOURS,total:STORM_DOSE[x.level],taken:0}));
  s.blackouts=ev.blackouts.map(x=>({...x,t:T(x.sol,x.hour)}));
  // Dust storms: timing is random each game (a game rule; strength modelled on the 2018 storm that hit Opportunity)
  s.dust=[]; const d1=4+Math.floor(r()*11); s.dust.push({start:d1,len:2+Math.floor(r()*2)});
  if(r()<0.6)s.dust.push({start:Math.max(d1+6,17+Math.floor(r()*10)),len:2+Math.floor(r()*3)});
  s.dust.forEach(d=>{d.t=T(d.start,0)});
  // Research opportunities: random each game
  const kinds=['eva','exp','seed'].sort(()=>r()-0.5); const used={}; s.opps=[];
  kinds.forEach(k=>{let sol;do{sol=3+Math.floor(r()*26)}while(used[sol]);used[sol]=1;s.opps.push({kind:k,t:T(sol,9+Math.floor(r()*6))})});
  return s;
}
const cells=(s,type)=>s.grid.filter(c=>c&&c.type===type);
const cap=s=>30+40*cells(s,'battery').length;
function place(s,i,type){const b=B[type];if(!b||s.grid[i]||s.parts<b.cost||s.over)return false;s.parts-=b.cost;s.grid[i]={type,on:type!=='shelter',run:false};return true}
function remove(s,i){const c=s.grid[i];if(!c||!B[c.type]||s.over)return false;s.parts+=Math.floor(B[c.type].cost/2);s.grid[i]=null;s.power=Math.min(s.power,cap(s));return true}
function toggle(s,i){const c=s.grid[i];if(!c||!B[c.type]||!B[c.type].use)return false;c.on=!c.on;return true}
function setShelter(s,on){cells(s,'shelter').forEach(c=>c.on=on)}
function choose(s,o,yes){ if(!yes||o.done)return false;
  const c={eva:['o2',30,25],exp:['power',40,20],seed:['food',20,20]}[o.kind];
  if(s[c[0]]<c[1])return false; s[c[0]]-=c[1]; s.science+=c[2]; s.stats.opps++; o.done=true; return true }
function step(s){
  const n=[]; if(s.over)return n;
  const t=T(s.sol,s.hour), day=s.hour>=6&&s.hour<18;
  const dust=s.dust.find(d=>s.sol>=d.start&&s.sol<d.start+d.len);
  const storm=s.storms.find(x=>t>=x.t&&t<x.t+x.dur);
  const blackout=s.blackouts.find(x=>t>=x.t&&t<x.t+x.dur);
  const gen=day?cells(s,'panel').length*8*(dust?0.25:1)*(s.up.wipers?1.25:1):0;
  s.power+=gen; let used=0; s.starved=false;
  const pay=c=>{if(s.power>=c){s.power-=c;used+=c;return true}s.starved=true;return false};
  pay(1);
  const shelterOn=cells(s,'shelter').some(c=>c.on);
  ORDER.forEach(type=>cells(s,type).forEach(c=>{
    c.why='';
    if(!c.on){c.run=false;return}
    if(blackout&&(type==='dish'||type==='lab')){c.run=false;c.why='blackout';return}
    if(type==='lab'&&shelterOn){c.run=false;c.why='shelter';return}
    c.run=pay(B[type].use); if(!c.run)c.why='power';
  }));
  s.power=Math.min(s.power,cap(s)); s.gen=gen; s.used=used;
  const run=type=>cells(s,type).filter(c=>c.run).length;
  s.sheltered=run('shelter')>0;
  s.o2=Math.min(200,s.o2+2*run('o2')+0.5*run('green')-2);
  s.food=Math.min(100,s.food+0.75*run('green')-0.5);
  s.science+=run('lab');
  s.dose+=BG_DOSE/24;
  if(storm){const d=storm.total/storm.dur; if(s.sheltered){s.stats.blocked+=d}else{s.dose+=d;storm.taken+=d;s.stats.stormDose+=d}}
  const dishRun=run('dish')>0;
  // upgrades (light automation)
  if(!s.up.robot&&s.science>=60){s.up.robot=true;s.income=3;n.push({type:'upgrade',which:'robot'})}
  if(!s.up.wipers&&s.science>=150){s.up.wipers=true;n.push({type:'upgrade',which:'wipers'})}
  // advance time
  s.hour++; if(s.hour>=24){s.hour=0;s.sol++;s.parts+=s.income;s.flags.brown=false; if(s.sol<=SOLS)n.push({type:'newSol'})}
  const tn=T(s.sol,s.hour);
  // fail / win
  if(s.o2<=0){s.o2=0;s.over={win:false,reason:'o2'}}
  else if(s.food<=0){s.food=0;s.over={win:false,reason:'food'}}
  else if(s.dose>=DOSE_LIMIT){s.over={win:false,reason:'dose'}}
  else if(s.sol>SOLS){s.over={win:true}}
  if(s.over){n.push({type:'over'});return n}
  // notices
  s.storms.forEach(x=>{const u=x.t-tn, lead=dishRun?8:1;
    if(!x.warned&&u>0&&u<=lead){x.warned=true;n.push({type:'stormWarn',storm:x,hours:u,dish:dishRun})}
    if(u===0)n.push({type:'stormStart',storm:x});
    if(tn===x.t+x.dur){setShelter(s,false);n.push({type:'stormEnd',storm:x})}});
  s.blackouts.forEach(x=>{if(tn===x.t)n.push({type:'blackout',b:x})});
  s.dust.forEach(d=>{const u=d.t-tn; if(!d.warned&&dishRun&&u>0&&u<=24){d.warned=true;n.push({type:'dustWarn',d,hours:u})}
    if(u===0)n.push({type:'dustStart',d}); if(tn===d.t+d.len*24)n.push({type:'dustEnd',d})});
  s.opps.forEach(o=>{if(tn===o.t)n.push({type:'opp',o})});
  const low=(k,v,lo,hi)=>{if(v<lo&&!s.flags[k]){s.flags[k]=true;n.push({type:'low',what:k})}else if(v>hi)s.flags[k]=false};
  low('o2',s.o2,50,80); low('food',s.food,20,35);
  if(s.dose>30&&!s.flags.dose){s.flags.dose=true;n.push({type:'low',what:'dose'})}
  if(s.starved&&!s.flags.brown){s.flags.brown=true;n.push({type:'brownout'})}
  return n;
}
function score(s){return Math.round(s.science+Math.max(0,DOSE_LIMIT-s.dose)*2)}
return {W,H,SOLS,DOSE_LIMIT,B,archiveEvents,eventsFromDonki,newGame,step,place,remove,toggle,setShelter,choose,cells,cap,score,T};
})();
if(typeof module!=='undefined')module.exports=Core;
</script>

<script id="ui">
(()=>{
if(typeof document==='undefined')return;
const $=id=>document.getElementById(id), C=Core;
let S=null, speed=0, lastSpeed=1, acc=0, lastT=0, tool=null, hover=-1, queue=[], modalOpen=false, pulse=0, busy=false, started=false;
const cv=$('cv'); let ctx=cv.getContext('2d');
const SRC={
 donki:'<a href="https://ccmc.gsfc.nasa.gov/tools/DONKI/" target="_blank" rel="noopener">NASA DONKI space weather database</a>',
 mars20:'<a href="https://www.jpl.nasa.gov/news/nasa-watches-mars-light-up-during-epic-solar-storm" target="_blank" rel="noopener">NASA JPL: Mars lights up during epic solar storm</a>',
 rad:'<a href="https://www.swri.org/press-release/swri-scientists-publish-first-radiation-measurements-surface-mars" target="_blank" rel="noopener">Curiosity rover RAD instrument (SwRI)</a>',
 comm:'<a href="https://www.nasa.gov/centers-and-facilities/goddard/space-communications-7-things-you-need-to-know/" target="_blank" rel="noopener">NASA: Space communications</a>',
 moxie:'<a href="https://www.jpl.nasa.gov/news/nasas-oxygen-generating-experiment-moxie-completes-mars-mission/" target="_blank" rel="noopener">NASA JPL: MOXIE completes Mars mission</a>',
 dust:'<a href="https://www.jpl.nasa.gov/news/opportunity-hunkers-down-during-dust-storm/" target="_blank" rel="noopener">NASA JPL: Opportunity hunkers down during dust storm</a>',
 bone:'<a href="https://www.nasa.gov/reference/risk-of-spaceflight-induced-bone-changes/" target="_blank" rel="noopener">NASA: Spaceflight bone changes</a>',
 osdr:'<a href="https://osdr.nasa.gov/bio/repo/" target="_blank" rel="noopener">NASA Open Science Data Repository (OSDR)</a>',
 facts:'<a href="https://science.nasa.gov/mars/facts/" target="_blank" rel="noopener">NASA: Mars facts</a>'

function isoPos(px,py){const dx=(px-OX)/(TW/2),dy=(py-OY)/(TH/2);return [(dx+dy)/2,(dy-dx)/2]}

  const gnd=isoTile(px,py); if(S&&tool&&tool!=='remove'&&gnd>=0&&!S.grid[gnd])return gnd; // building: aim at the ground square
  if(S)for(let i=C.W*C.H-1;i>=0;i--){const c=S.grid[i],h=c&&HGT[c.type];if(!h)continue;
    for(const z of [h,h*.66,h*.33]){const [u,v]=isoPos(px,py+z);if(Math.abs(u-i%C.W-.5)<=.4&&Math.abs(v-Math.floor(i/C.W)-.5)<=.4){

  return isoTile(px,py)}

  else if(n.type==='stormEnd'){const x=n.storm;log('✅ Storm over. Crew got '+x.taken.toFixed(1)+' mSv from it'+(x.taken<x.total?' (shelter blocked '+(x.total-x.taken).toFixed(1)+')':'')+'.')}
  else if(n.type==='blackout'){modal({big:'📻❌',title:'Radio blackout!',body:'<p>A giant solar flare (class <b>'+n.b.cls+'</b>) is scrambling radio signals. For 6 hours the comms dish and the science lab cannot talk to Earth, so they pause.</p><p class="src">📊 Real data: NASA recorded this flare on '+n.b.date+' (event ID '+n.b.id+'). '+SRC.donki+'</p>'});log('📻 Radio blackout for 6 hours.')}
  else if(n.type==='dustWarn'){modal({big:'🌪️',title:'Dust storm coming!',body:'<p>📡 Earth\'s orbiters spotted a dust storm. It arrives in about <b>'+n.hours+' hours</b> and lasts <b>'+n.d.len+' sols</b>.</p><p>Dust blocks sunlight, so solar panels will make only <b>a quarter</b> of their power. Fill your batteries and think about what to switch off.</p><p class="src">📊 Real story: in 2018 a dust storm blocked so much Sun that the Opportunity rover could not recharge. '+SRC.dust+' (Dust storm timing in this game is random.)</p>'})}
  else if(n.type==='dustStart'){ if(!n.d.warned)modal({big:'🌪️',title:'Surprise dust storm!',body:'<p>A dust storm just rolled in and will last <b>'+n.d.len+' sols</b>. Solar panels make only <b>a quarter</b> of their power.</p><p>With a working 📡 comms dish, Earth could have warned you a whole sol earlier.</p><p>Tap machines to switch some off. Which ones can wait?</p><p class="src">📊 Real story: the 2018 dust storm and the Opportunity rover. '+SRC.dust+'</p>'}); log('🌪️ Dust storm started.')}
  else if(n.type==='dustEnd')log('🌤️ The dust has cleared. Panels are back to full power.')
  else if(n.type==='opp'){const o=n.o,D={
     eva:['🧑‍🚀','A strange rock!','The crew spotted a rock that might hold signs of ancient water. A spacewalk to grab it uses up suit air.','30 oxygen','25 science',S.o2>=30],
     exp:['🔭','A rare experiment!','Scientists on Earth ask you to run a big experiment right now. It needs a lot of electricity.','40 power','20 science',S.power>=40],
     seed:['🌾','Plant test!','You could use some of your food seeds to test how plants grow in Mars soil instead of eating them.','20 food','20 science',S.food>=20]}[o.kind];
    modal({big:D[0],title:D[1],body:'<p>'+D[2]+'</p><p>Cost: <b>'+D[3]+'</b>. Reward: <b>'+D[4]+'</b>.</p><p>'+(D[5]?'Is the science worth it right now?':'You do not have enough to do this right now.')+'</p>',
     buttons:(D[5]?[{label:'Yes, do the science!',fn:()=>{if(C.choose(S,o,true)){const h=habXY();sparks(h[0],h[1]-40,22,'210,160,255');floatText(h[0],h[1]-90,'+'+D[4].split(' ')[0]+' 🔬','#d9a6ff')}log('🔬 Extra science done: cost '+D[3]+'.')}}]:[]).concat([{label:'No, play it safe',alt:true,fn:()=>log('Skipped the extra science to stay safe.')}])})}
  else if(n.type==='low'){const M={o2:['💨','Oxygen is running low!','Your crew breathes 2 oxygen every hour. Build or switch on an Oxygen Maker, and make sure it has power.'],
     food:['🥕','Food is running low!','A Greenhouse grows food, but only while it has power.'],
     dose:['☢️','Radiation dose is getting high!','The crew has had a lot of radiation. Use the Storm Shelter in the next storm, even if science has to stop.</p><p class="src">📊 Why it matters: NASA\'s open science library holds 232 studies on radiation and living things, such as OSD-73, which tested gamma rays and heavy space particles on human lung cells. '+SRC.osdr+'']}[n.what];
    modal({big:M[0],title:M[1],body:'<p>'+M[2]+'</p>'})}
  else if(n.type==='brownout'){log('⚡ Not enough power! Some machines stopped. Oxygen gets power first.'); if(!S.flags.brownTold){S.flags.brownTold=true;modal({big:'⚡',title:'Power ran out!',body:'<p>There was not enough power for every machine, so some stopped (look for the red ⚡ on the map).</p><p>The base gives power to oxygen first, then the shelter, greenhouse, dish and lab.</p><p>You can build more solar panels or batteries, or switch machines off yourself. What matters most right now?</p>'})}}
  else if(n.type==='over'){setSpeed(0,true);setTimeout(endGame,S.over.win?900:1900)}
}
function endGame(){
  setSpeed(0,true); queue=[]; const w=S.over.win, sc=C.score(S), fact=FACTS[Math.floor(Math.random()*FACTS.length)];
  const why={o2:'The oxygen ran out, so the crew flew home early. Next time, give the Oxygen Maker power before anything else.',
    food:'The food ran out, so the crew flew home early. Next time, keep a Greenhouse powered.',
    dose:'The crew got too much radiation and flew home early to stay healthy. Next time, use the Storm Shelter during big storms.'}[S.over.reason];
  const stars=sc>=1300?'⭐⭐⭐':sc>=800?'⭐⭐':'⭐';
  modal({big:w?'🎉':'🚀',title:w?'Mission complete! '+stars:'Mission ended on sol '+S.sol,body:
   '<p>'+(w?'Your crew lived on Mars for 30 sols and is safe.':why+' Everyone is safe, and now you know more than before.')+'</p>'+
   '<table><tr><td>🔬 Science points</td><td><b>'+Math.round(S.science)+'</b></td></tr><tr><td>☢️ Radiation dose</td><td><b>'+S.dose.toFixed(1)+' mSv</b> (limit '+C.DOSE_LIMIT+')</td></tr>'+
   '<tr><td>🛡️ Storm radiation blocked by shelter</td><td><b>'+S.stats.blocked.toFixed(1)+' mSv</b></td></tr><tr><td>🏆 Score (science + health bonus)</td><td><b>'+sc+'</b></td></tr></table>'+
   '<p>'+(w?(S.stats.stormDose>8?'You did lots of science but the crew took a big dose. Could you get the same score more safely?':'You kept the crew safe. Could you squeeze in more science next time?'):'')+'</p>'+
   '<p class="src">💡 Did you know? '+fact+'</p>',
   buttons:[{label:'🔁 Play again'},{label:'📚 See the real NASA data',alt:true,fn:dataPanel}]});
}

/* ---------- data panel ---------- */
function dataPanel(){
  const live=S&&S.ev.mode==='live';
  modal({title:'📚 The real NASA data in this game',body:
  '<p>Current mission data: <b>'+(S?S.ev.label:'not started')+'</b>. '+(live?'This was downloaded from NASA when you pressed start.':'This is an <b>archived copy</b> saved inside the game. It is real, but it is not live.')+'</p>'+
  '<h3>Real measurements and records</h3><table>'+
  '<tr><td>Solar particle storms and their dates</td><td>14 detections on May 9, 10, 11 and 13, 2024, from '+SRC.donki+' (SEP events). Each sol of the mission uses one real Earth day of this record.</td></tr>'+
  '<tr><td>Solar flare radio blackout</td><td>X8.7 flare, May 14, 2024, DONKI ID 2024-05-14T16:46:00-FLR-001.</td></tr>'+
  '<tr><td>May 20, 2024 storm at Mars</td><td>Curiosity measured 8,100 micrograys, equal to 30 chest X-rays. '+SRC.mars20+'</td></tr>'+
  '<tr><td>Everyday radiation on Mars: 0.67 mSv per day</td><td>'+SRC.rad+', measured August 2012 to June 2013.</td></tr>'+
  '<tr><td>Earth to Mars message delay: 4 to 24 minutes</td><td>'+SRC.comm+'</td></tr>'+
  '<tr><td>Making oxygen from Mars air</td><td>MOXIE made up to 12 grams an hour. '+SRC.moxie+'</td></tr>'+
  '<tr><td>Dust storms block solar power</td><td>2018 storm: sky dust level rose from about 0.5 to 10.8. '+SRC.dust+'</td></tr>'+
  '<tr><td>A sol (Mars day) is 24.6 hours</td><td>'+SRC.facts+'</td></tr>'+
  '<tr><td>Bone loss in space</td><td>'+SRC.bone+'</td></tr>'+
  '<tr><td>Radiation and living things</td><td>'+SRC.osdr+': a search for "radiation" returned 232 studies when this game was built, including OSD-73 (human lung cells exposed to gamma rays and heavy particles), OSD-97 (yeast and high-energy radiation) and OSD-115 (human skin cells after X-rays). <a href="https://osdr.nasa.gov/osdr/data/search?term=radiation" target="_blank" rel="noopener">Search API</a></td></tr></table>'+
  '<h3>Game rules we made up (not NASA numbers)</h3><table>'+
  '<tr><td>Storm size</td><td>Small, medium or huge depending on how many DONKI detections were logged that day. Doses of 2, 4 and 8 mSv are simplified; the 8 is based on the Curiosity reading.</td></tr>'+
  '<tr><td>Radiation limit of 40 mSv</td><td>A game limit for a 30-sol mission, not a NASA rule.</td></tr>'+
  '<tr><td>Power, oxygen, food and parts numbers</td><td>Simplified so the trade-offs are easy to see. A game sol has 24 hours.</td></tr>'+
  '<tr><td>Warning times</td><td>The real delay is minutes. In the game a dish gives 8 hours of warning instead of 1.</td></tr>'+
  '<tr><td>Dust storm and bonus science timing</td><td>Random each game, so every mission is different.</td></tr></table>'+
  '<p class="src">Sol Keepers is a student project and is not made or endorsed by NASA.</p>',buttons:[{label:'Close'}]});
}
$('bdata').onclick=dataPanel; $('bdata2').onclick=dataPanel;

/* ---------- start ---------- */
function start(ev){
  S=C.newGame((Date.now()^Math.random()*1e9)>>>0,ev); started=true; tool=null; fxp=[]; born={}; launchT=0; const sc=$('scroll'); sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2; $('log').innerHTML=''; queue=[];
  $('badge').textContent=(ev.mode==='live'?'📡 ':'💾 ')+ev.label; $('badge').classList.toggle('live',ev.mode==='live');
  lastSpeed=1; refresh(); log('🚀 Landed on Mars with 4 crew. Build an Oxygen Maker and a Greenhouse first!');
  if(ev.mode==='live'&&!ev.storms.length)modal({big:'😎',title:'The Sun has been quiet',body:'<p>NASA recorded no solar particle storms in the last 30 days, so this mission has calm space weather. Watch out for dust storms instead!</p>'});
  const skip={label:'Skip',alt:true,fn:()=>{queue=[]}};
  modal({big:'🧑‍🚀',title:'Welcome, Commander!',body:'<p>Your 4 crew need <b>💨 oxygen</b> to breathe and <b>🥕 food</b> to eat. Every machine that makes them runs on <b>⚡ power</b>.</p><p>A <b>sol</b> is one day on Mars. Keep everyone safe for <b>30 sols</b>.</p>',buttons:[{label:'Next'},skip]});
  modal({big:'🔧',title:'How to build',body:'<p>Pick a building from the Build list, then tap a square on the map. Buildings cost <b>🔩 parts</b>. New parts arrive every sol.</p><p>Tap a machine on the map to switch it <b>off</b> and save power. 💤</p><p><b>Nothing is free:</b> power used for one thing cannot be used for another.</p>',buttons:[{label:'Next'},skip]});
  modal({big:'☀️',title:'Watch the Sun',body:'<p>The storms in this game are <b>real</b>. They come from NASA\'s space weather records. A 🛡️ shelter keeps the crew safe, but it eats power and stops science.</p><p>Do science to score points. Stay safe to finish. Good luck!</p>',buttons:[{label:'🚀 Start!'}]});
}
async function startLive(){
  busy=true; modalOpen=true; $('ov').classList.add('show');
  $('box').innerHTML='<div class="big">📡</div><h2>Calling NASA…</h2><p>Asking the DONKI database for the last 30 days of space weather.</p>';
  try{
    const end=new Date(), st=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth(),end.getUTCDate())-29*864e5);
    const q='?startDate='+st.toISOString().slice(0,10)+'&endDate='+end.toISOString().slice(0,10)+'&api_key=DEMO_KEY';
    const ac=new AbortController(), to=setTimeout(()=>ac.abort(),8000);
    const get=p=>fetch('https://api.nasa.gov/DONKI/'+p+q,{signal:ac.signal}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(t=>t?JSON.parse(t):[]);
    const sep=await get('SEP'); let flr=[]; try{flr=await get('FLR')}catch(e){}
    clearTimeout(to); if(!Array.isArray(sep))throw new Error('bad data');
    busy=false; modalOpen=false; start(C.eventsFromDonki(sep,Array.isArray(flr)?flr:[],st));
  }catch(e){
    busy=false; modalOpen=false; queue=[];
    modal({big:'📡❌',title:'Could not reach NASA',body:'<p>The live data did not arrive (the network or this page may block it). No problem: we will use the <b>archived</b> real data from May 2024 instead.</p>',buttons:[{label:'Start with archived data',fn:()=>start(C.archiveEvents())}]});
  }
}
function title(){
  S=S||C.newGame(1,C.archiveEvents()); started=false; setSpeed(0,true); refresh(); queue=[]; modalOpen=false;
  modal({big:'🪐',title:'Sol Keepers',body:'<p>Run a base on Mars for 30 sols. Split your power between air, food, safety and science. <b>Every choice costs something.</b></p><p>Choose the space weather for your mission:</p>',
   buttons:[{label:'💾 May 2024: the biggest solar storms in 20 years (archived NASA data)',fn:()=>start(C.archiveEvents())},
            {label:'📡 The last 30 days (live from NASA)',alt:true,fn:()=>{startLive()}}]});
}
function frame(ts){
  const dt=Math.min(200,ts-lastT||0); lastT=ts; pulse+=dt/200; now=ts;
  if(S&&speed&&!modalOpen&&!S.over){acc+=dt; const per=speed===3?230:750; let g=0;
    while(acc>=per&&g<4&&!modalOpen&&!S.over){acc-=per;g++;C.step(S).forEach(handle)} if(g)refresh()}
  fx(dt); draw(); requestAnimationFrame(frame);
}
buildPalette(); title(); requestAnimationFrame(frame);
})();
</script>
